                document.getElementById('hexbutmenumovin').classList.add("hexbutmenumovclosed");
                var dropdowns = document.getElementsByClassName("midropdown-content");
                var i;
                for (i = 0; i < dropdowns.length; i++) {
                  var openDropdown = dropdowns[i];
                  if (openDropdown.classList.contains('ddshow')) {
