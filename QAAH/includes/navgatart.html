            window.addEventListener('mousemove',mueveojos)
            function mueveojos(event) {
              var xrel=event.clientX/window.innerWidth
              var yrel=event.clientY/window.innerHeight
              document.getElementById('pupila').style.width = 60*xrel+'%';
              document.getElementById('subpupila').style.left = 60*xrel+'%';
              document.getElementById('subpupila').style.width = (100-60*xrel)+'%';
              document.getElementById('subpupila').style.height = (60-55*yrel)+'%';
            }

            function abrecierra(ddmenu) {
              xx=document.getElementsByClassName(ddmenu)
              for (i = 0; i < xx.length; i++) {
                  var xxx = xx[i];
                  xxx.classList.remove('ddinactive');
                  xxx.classList.add('ddactive');
                  //xxx.classList.toggle("ddactive");   
                  xxx.replaceWith(xxx.cloneNode(true)); 
              }
            }
