            function abrecierra(ddmenu) {
              xx=document.getElementsByClassName(ddmenu)
              for (i = 0; i < xx.length; i++) {
                  var xxx = xx[i];
                  xxx.classList.remove('ddinactive');
                  xxx.classList.add('ddactive');
                  //xxx.classList.toggle("ddactive");   
                  xxx.replaceWith(xxx.cloneNode(true)); 
              }
            }

            function cierra(ddmenu) {
              var dropdowns = document.getElementsByClassName(ddmenu);
              for (i = 0; i < dropdowns.length; i++) {
                  var xel = dropdowns[i];
                  if (xel.classList.contains('ddactive')) {

                    xel.classList.add('ddinactive');
