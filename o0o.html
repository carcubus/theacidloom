    else {oii.style.animation = "desformani 2s";}
    oii.style.width = "0px";

    o1.style.animation = 'none';

    setTimeout(function() {desformcontac("circle3b");},1000);
  }
  function desffatuo(objeto) {
    var z=document.getElementById(objeto);
    var acttamy=z.height;
    var acttamx=z.width;
    z.style.minWidth = '0px';
    z.style.minHeight = '0px';
    z.style.animation = 'none';
    z.offsetHeight; /* trigger reflow */
    z.style.setProperty('--heig0',acttamy);
    z.style.setProperty('--widt0',acttamx);
    z.style.animation = "desffatuoani 0.8s";
    z.style.width = "0px";
    z.style.height = "0px";
    z.style.opacity = 0;
  }
  function apaffatuo(objeto) {
    var z=document.getElementById(objeto);
    var otamy='8vmin';
    var otamx='8vmin';
    z.style.animation = 'none';
    z.offsetHeight; /* trigger reflow */
    z.style.setProperty('--heig0',otamy);
    z.style.setProperty('--widt0',otamx);
    z.style.animation = "apaffatuoani 3s";
    z.style.width = otamx;
    z.style.height = otamy;
    z.style.minWidth = '50px';
    z.style.minHeight = '50px';
    z.style.opacity = 1;

      z.onmouseover = function(){       
       z.style.animation = "latec 1.2s ease 0s 3";
      }
      z.onmouseout = function(){       
       z.style.animation = "none";
      }
    }
  }

      function animalo(xsvg,xtam) {
      var x=document.getElementById(xsvg);
      var randelay=Math.random()*15;
      var rantanima=Math.random()*20+5;
      var rantamx=Math.random()*0.8+xtam;
      var ranx=Math.random()*10-5; //-0.5*x.style.width;
      var rany=Math.random()*10-5; //-0.5*x.style.height;
      var cling= document.getElementById("soni"+xsvg);
      x.style.setProperty('--posx0',50+ranx+'%');
      x.style.setProperty('--posy0',50+rany+'%');
      x.style.setProperty('--tamx0',rantamx+'%');
      x.style.setProperty('--posx100',50+200*ranx+'%');
      x.style.setProperty('--posy100',50+200*rany+'%');
      x.style.setProperty('--tamx100',200*rantamx+'%');
      x.style.animation = 'animasvg '+rantanima+'s';
      cling.playbackRate = 11/rantanima;
      cling.preservesPitch = 0;
      setTimeout(function() { cling.play() }, randelay*1000 );
      //if (xsvg == "svg1") {setTimeout(function() { cling.play() }, randelay*1000 );}
      //cling.play();
      x.style.setProperty('animation-delay',randelay+'s');
      x.style.setProperty('animation-timing-function','cubic-bezier(0.99,0,0.99,0)');

    function animaicuacua(xdiv) {
      var x=document.getElementById(xdiv);
      var rantamx=Math.random()*80+40;
      var rantamy=Math.random()*80+50;
      var randelay=Math.random()*0.5;
      var rantanima=Math.random()*1+0.6-randelay;
      /*var randirx=Math.round(Math.random())*2-1;    */
      var ranr=Math.random()*50+60;
      var ranang=Math.random()*2*Math.PI;
      var ranx=ranr*Math.cos(ranang)-0.5*rantamx; 
      var rany=ranr*Math.sin(ranang)-0.5*rantamy; 
      x.style.setProperty('--posx0',50+ranx+'%');
      x.style.setProperty('--posy0',50+rany+'%');
      x.style.setProperty('--tamx0',rantamx+'%');
      x.style.setProperty('--tamy0',rantamy+'%');
      x.style.animation = 'animacuacua '+rantanima+'s';
      x.style.setProperty('animation-delay',randelay+'s');
    }

    function changeani(ix) { //cambia de animación flotante a animación de selección

        let ysvg=svglist[i];
        let z=document.getElementById(ysvg);
        var zBCR=z.getBoundingClientRect();
        var acttamy=100*zBCR.height/window.innerHeight;
        var acttamx=100*zBCR.width/window.innerWidth;
        var actx=100*zBCR.x/window.innerWidth;
        var acty=100*zBCR.y/window.innerHeight;
        //if (ix != 11)
        z.style.animation = 'none';
        console.log(i,ix,ysvg);
        if (svgtag[i] == ix) {
          z.getBBox(); /* trigger reflow svg */
          z.offsetHeight; /* trigger reflow */
          z.style.height=acttamy+'%';
          z.style.width=acttamx+'%';
          z.style.left=actx+'%';
          z.style.top=acty+'%';
          animsel(ysvg,actx,acty,acttamy);
        } 
        else if (actx < 105) {
          z.getBBox(); /* trigger reflow svg */
          z.offsetHeight; /* trigger reflow */
            z.style.height=acttamy+'%';
            z.style.width=acttamx+'%';
            z.style.left=actx+'%';
            z.style.top=acty+'%';
            let funaniname='anim'+ix;
